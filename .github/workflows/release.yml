name: Release build
# Manual only. This workflow never creates, uploads to or overwrites a GitHub release:
# releases are published by hand from a green CI run's artifact. (Until v1.1 it ran on tag
# push and re-uploaded assets with --clobber, replacing the verified ones.)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DBinDir=..\build\Release installer\CastRecorder.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: |
            build/Release/CastRecorder.exe
            dist/*.exe
