name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build (MSVC, Release)
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=1.0.0 /DBinDir=..\build\Release installer\CastRecorder.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: cast-recorder-windows
          path: |
            build/Release/CastRecorder.exe
            dist/*.exe

  smoke-record:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        fps: [15, 30, 60]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cast-recorder-windows
          path: art
      - name: Install ffmpeg (for ffprobe and MKV remux)
        run: choco install ffmpeg -y --no-progress
      - name: Record 4 s with the software encoder
        shell: pwsh
        run: |
          $exe = Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1
          foreach ($c in @('mp4','mkv')) {
            $out = "$env:RUNNER_TEMP\smoke-${{ matrix.fps }}.$c"
            # The runner has a desktop session but no GPU; --allow-synthetic falls back to a test pattern only if screen capture is unavailable.
            $p = Start-Process $exe.FullName -ArgumentList "--record 4 --fps ${{ matrix.fps }} --encoder software --quality medium --container $c --allow-synthetic --out `"$out`"" -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\rec-$c.txt"
            Get-Content "$env:RUNNER_TEMP\rec-$c.txt"
            if ($p.ExitCode -ne 0) { throw "recorder exit code $($p.ExitCode)" }
            if (-not (Test-Path $out)) { throw "$out was not created" }
            $rate = (ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate,r_frame_rate,codec_name,nb_frames -of default=nw=1 $out)
            $rate
            $avg = ($rate | Select-String 'avg_frame_rate=(\d+)/(\d+)').Matches[0].Groups
            $fps = [double]$avg[1].Value / [double]$avg[2].Value
            $dur = [double](ffprobe -v error -show_entries format=duration -of csv=p=0 $out)
            "measured fps=$fps duration=$dur"
            if ([math]::Abs($fps - ${{ matrix.fps }}) -gt 0.5) { throw "expected ${{ matrix.fps }} fps, got $fps" }
            if ($dur -lt 2.5) { throw "duration too short: $dur" }
            if (-not ($rate -match 'codec_name=h264')) { throw "not H.264" }
          }
