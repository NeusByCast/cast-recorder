name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build (MSVC, Release)
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        shell: pwsh
        run: |
          $v = (Select-String -Path src\win\version.h -Pattern 'CR_VERSION_STR\s+"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$v /DBinDir=..\build\Release installer\CastRecorder.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: cast-recorder-windows
          path: |
            build/Release/CastRecorder.exe
            dist/*.exe

  smoke-record:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        fps: [15, 30, 60]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cast-recorder-windows
          path: art
      - name: Install ffmpeg (for ffprobe and MKV remux)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ff"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\ff" -Recurse -Filter ffprobe.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin
          & "$bin\ffprobe.exe" -version | Select-Object -First 1
      - name: CLI argument validation
        shell: pwsh
        run: |
          $exe = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          $p = Start-Process $exe -ArgumentList "--help --log `"$env:RUNNER_TEMP\help.txt`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--help exit $($p.ExitCode)" }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\help.txt" -Pattern 'Usage:' -Quiet)) { throw "--help printed no usage" }
          if (Select-String -Path "$env:RUNNER_TEMP\help.txt" -Pattern 'screenshot FILE|--screenshot' -Quiet) { throw "--help still lists --screenshot (removed in v1.1)" }
          $p = Start-Process $exe -ArgumentList "--screenshot `"$env:RUNNER_TEMP\x.png`"" -Wait -PassThru
          if ($p.ExitCode -ne 2) { throw "--screenshot should be rejected as an unknown option (exit 2), got $($p.ExitCode)" }
          $cases = @('--record 0', '--record -3', '--record abc', '--record 100000', '--record 2 --fps 25',
                     '--record 2 --container avi', '--record 2 --encoder foo', '--record 2 --quality max',
                     '--record 2 --bogus', '--record', '--fps 30', '--record 2 --out "Q:\nope\x.mp4"')
          foreach ($c in $cases) {
            $p = Start-Process $exe -ArgumentList "$c --log `"$env:RUNNER_TEMP\bad.txt`"" -Wait -PassThru
            "$c -> exit $($p.ExitCode): $((Get-Content "$env:RUNNER_TEMP\bad.txt" -ErrorAction SilentlyContinue | Select-Object -First 1))"
            if ($p.ExitCode -ne 2) { throw "expected exit 2 for '$c'" }
          }
      - name: Record 4 s with the software encoder
        shell: pwsh
        run: |
          $exe = Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1
          New-Item -ItemType Directory rec -Force | Out-Null
          # Explicit start→stop via CLI (the --record timer calls stop() then waitUntilIdle).
          $p0 = Start-Process $exe.FullName -ArgumentList "--record 1 --fps ${{ matrix.fps }} --encoder software --allow-synthetic --out `"$PWD\rec\start-stop-${{ matrix.fps }}.mp4`" --log `"$PWD\rec\start-stop-${{ matrix.fps }}.txt`"" -Wait -PassThru
          $slog = "$PWD\rec\start-stop-${{ matrix.fps }}.txt"
          if (Test-Path $slog) { Get-Content $slog } else { throw "start-stop log missing" }
          if (-not (Select-String -Path $slog -Pattern '^ok=1' -Quiet)) { throw "start-stop smoke failed (log)" }
          # Stuck-Finalize: hang longer than the Finalize half-budget; must return Idle, temp gone, no second start.
          if (${{ matrix.fps }} -eq 30) {
            $hangOut = "$PWD\rec\hang.mp4"
            $hangLog = "$PWD\rec\hang.txt"
            $pH = Start-Process $exe.FullName -ArgumentList "--record 3 --fps 30 --encoder software --allow-synthetic --test-hang-finalize 8000 --out `"$hangOut`" --log `"$hangLog`"" -Wait -PassThru
            if (Test-Path $hangLog) { Get-Content $hangLog } else { throw "hang log missing" }
            if (-not (Select-String -Path $hangLog -Pattern 'abandoned=1' -Quiet)) { throw "expected abandoned=1 on hang-finalize" }
            # v1.0: recordings are fragmented MP4 -> a stuck Finalize must KEEP what was written, and it must play.
            if (-not (Test-Path $hangOut) -or (Get-Item $hangOut).Length -eq 0) { throw "hang.mp4 was deleted after a stuck Finalize (must be kept)" }
            if (Test-Path "$hangOut.part.mp4") { throw "leftover hang.part.mp4" }
            $hf = [int](ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 $hangOut)
            "hang.mp4 kept: $((Get-Item $hangOut).Length) bytes, $hf decodable frames"
            if ($hf -lt 30) { throw "kept hang.mp4 has only $hf decodable frames" }
            if (-not (Select-String -Path $hangLog -Pattern '^state=idle' -Quiet)) { throw "UI/recorder did not return to Idle" }
            if (-not (Select-String -Path $hangLog -Pattern '^second_start=refused' -Quiet)) { throw "second start after abandon should be refused" }
            $pR = Start-Process $exe.FullName -ArgumentList "--render-ui `"$PWD\rec\ui-idle.bmp`" --ui-state idle --log `"$PWD\rec\ui.txt`"" -Wait -PassThru
            if (-not (Test-Path "$PWD\rec\ui-idle.bmp")) { throw "ui-idle.bmp missing" }
          }
          # Pause/Resume: 6 s wall, paused 2..4 s. Duration must equal recorded minus paused time, PTS continuous.
          if (${{ matrix.fps }} -eq 30) {
            $pOut = "$PWD\rec\pause.mp4"; $pLog = "$PWD\rec\pause.txt"
            $pp = Start-Process $exe.FullName -ArgumentList "--record 6 --fps 30 --encoder software --allow-synthetic --pause-at 2 --resume-at 4 --out `"$pOut`" --log `"$pLog`"" -Wait -PassThru
            Get-Content $pLog
            if (-not (Select-String -Path $pLog -Pattern '^ok=1' -Quiet)) { throw "pause recording failed" }
            $pm = (Select-String -Path $pLog -Pattern 'paused_ms=(\d+) pauses=(\d+)').Matches[0].Groups
            if ([int]$pm[2].Value -ne 1) { throw "worker saw $($pm[2].Value) pauses, expected 1" }
            $expect = 6.0 - [double]$pm[1].Value / 1000.0
            $dur = [double](ffprobe -v error -show_entries format=duration -of csv=p=0 $pOut)
            "pause: paused_ms=$($pm[1].Value) expected=$expect duration=$dur"
            if ([math]::Abs($dur - $expect) -gt 0.1) { throw "duration $dur != recorded minus paused ($expect)" }
            $pts = ffprobe -v error -select_streams v:0 -show_entries packet=pts_time -of csv=p=0 $pOut | ForEach-Object { [double]$_ } | Sort-Object
            $maxGap = 0.0
            for ($i = 1; $i -lt $pts.Count; $i++) { $gap = $pts[$i] - $pts[$i-1]; if ($gap -gt $maxGap) { $maxGap = $gap } }
            "pause: packets=$($pts.Count) max_pts_gap=$maxGap"
            if ([math]::Abs($pts.Count - 120) -gt 2) { throw "frame count $($pts.Count) != 120 +-2" }
            if ($maxGap -gt (1.5 / 30)) { throw "PTS gap $maxGap s: timestamps not continuous across pause" }
            $late = (Select-String -Path $pLog -Pattern 'late=(\d+)').Matches[0].Groups[1].Value
            if ([int]$late -gt 3) { throw "pause was counted as $late late frames" }
          }
          foreach ($c in @('mp4','mkv','mov')) {
            $out = "$PWD\rec\smoke-${{ matrix.fps }}.$c"
            $log = "$PWD\rec\smoke-${{ matrix.fps }}-$c.txt"
            # The runner has a desktop session but no GPU; --allow-synthetic falls back to a test pattern only if screen capture is unavailable.
            $p = Start-Process $exe.FullName -ArgumentList "--record 4 --fps ${{ matrix.fps }} --encoder software --quality medium --container $c --allow-synthetic --test-tone --out `"$out`" --log `"$log`"" -Wait -PassThru
            if (Test-Path $log) { Get-Content $log } else { throw "log missing for $c" }
            if (-not (Select-String -Path $log -Pattern '^ok=1' -Quiet)) { throw "recorder failed for $c (log)" }
            if (-not (Test-Path $out)) { throw "$out was not created" }
            if (Test-Path "$out.part.mp4") { throw "leftover $out.part.mp4" }
            $info = (ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate,r_frame_rate,codec_name,nb_frames -of default=nw=1 $out)
            $info
            $avg = ($info | Select-String 'avg_frame_rate=(\d+)/(\d+)').Matches[0].Groups
            $fps = [double]$avg[1].Value / [double]$avg[2].Value
            $dur = [double](ffprobe -v error -show_entries format=duration -of csv=p=0 $out)
            "measured fps=$fps duration=$dur"
            # Nominal rate must be exact; the average may dip slightly when the GPU-less runner drops a few late frames on the real desktop (<6%; the strict fps check is on the test pattern below).
            $rr = ($info | Select-String 'r_frame_rate=(\d+)/(\d+)').Matches[0].Groups
            $nominal = [double]$rr[1].Value / [double]$rr[2].Value
            # MP4 stores the exact rate; MKV's r_frame_rate is ffprobe's guess from ms timestamps: same tolerance as the achieved-fps check
            if ($c -eq 'mp4') { if ($nominal -ne ${{ matrix.fps }}) { throw "nominal rate is not ${{ matrix.fps }}" } }
            elseif ($nominal -lt ${{ matrix.fps }} * 0.94 -or $nominal -gt ${{ matrix.fps }} + 0.5) { throw "$c nominal rate $nominal is not ~${{ matrix.fps }}" }
            if ($fps -lt ${{ matrix.fps }} * 0.94 -or $fps -gt ${{ matrix.fps }} + 0.5) { throw "expected ~${{ matrix.fps }} fps, got $fps" }
            if ([math]::Abs($dur - 4.0) -gt 0.5) { throw "expected ~4 s, got $dur" }
            if (-not ($info -match 'codec_name=h264')) { throw "not H.264" }
            # Full decode: every packet must decode with zero errors (catches missing SPS/PPS, bad moov, non-keyframe start).
            $dec = & ffmpeg -hide_banner -v error -xerror -i $out -f null - 2>&1
            if ($LASTEXITCODE -ne 0 -or $dec) { $dec; throw "$c does not decode cleanly" }
            $nf = [int](ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 $out)
            "decoded frames=$nf"
            if ($nf -lt (${{ matrix.fps }} * 3)) { throw "$c decoded only $nf frames" }
            if (-not (Select-String -Path $log -Pattern 'encoder=Software' -Quiet)) { throw "unexpected encoder" }
            # Audio: AAC track present, decodes, and is in sync with video (stream durations within 100 ms).
            $acodec = ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 $out
            $acodec
            if (-not ($acodec -match 'codec_name=aac')) { throw "$c has no AAC audio track" }
            $adec = & ffmpeg -hide_banner -v error -xerror -i $out -map 0:a:0 -f null - 2>&1
            if ($LASTEXITCODE -ne 0 -or $adec) { $adec; throw "$c audio does not decode cleanly" }
            $vd = [double](& ffmpeg -hide_banner -i $out -map 0:v:0 -f null - 2>&1 | Select-String 'time=(\d+):(\d+):([\d.]+)' | Select-Object -Last 1 | ForEach-Object { $g = $_.Matches[0].Groups; [double]$g[1].Value*3600 + [double]$g[2].Value*60 + [double]$g[3].Value })
            $ad = [double](& ffmpeg -hide_banner -i $out -map 0:a:0 -f null - 2>&1 | Select-String 'time=(\d+):(\d+):([\d.]+)' | Select-Object -Last 1 | ForEach-Object { $g = $_.Matches[0].Groups; [double]$g[1].Value*3600 + [double]$g[2].Value*60 + [double]$g[3].Value })
            $as = [double](ffprobe -v error -select_streams a:0 -show_entries packet=pts_time -of csv=p=0 -read_intervals "%+#1" $out | Select-Object -First 1)
            "a/v: video=$vd s audio=$ad s audio_start=$as s"
            if ([math]::Abs($vd - $ad) -gt 0.1) { throw "$c audio/video durations differ: $vd vs $ad" }
            if ([math]::Abs($as) -gt 0.05) { throw "$c audio starts at $as s (expected 0)" }
            if (-not (Select-String -Path $log -Pattern 'SetInputType\(NV12\): 0x00000000 ok' -Quiet)) { throw "software encoder did not go through the pass-through MFT writer" }
            if (-not (Select-String -Path $log -Pattern 'fragmented=1' -Quiet)) { throw "$c was not recorded as fragmented MP4 (crash-safe)" }
            if ($c -ne 'mp4' -and -not (Select-String -Path $log -Pattern 'post: converted' -Quiet)) { throw "${c}: no stream copy from the recorded MP4" }
            if ($c -eq 'mp4') { $atoms = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($out)); if ($atoms.IndexOf('moof') -lt 0) { throw "smoke mp4 has no moof (not fragmented)" } }
            $ach = [int](ffprobe -v error -select_streams a:0 -show_entries stream=channels -of csv=p=0 $out)
            if ($ach -ne 2) { throw "$c audio has $ach channels (stereo is the default)" }
          }
      - name: Quality (SSIM/PSNR vs reference) and achieved fps on the static test pattern
        shell: pwsh
        run: |
          $exe = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory rec -Force | Out-Null
          $ref = "$PWD\rec\pattern.yuv"
          Start-Process $exe -ArgumentList "--render-pattern `"$ref`"" -Wait
          if (-not (Test-Path $ref)) { throw "reference pattern missing" }
          $fps = ${{ matrix.fps }}
          $out = "$PWD\rec\quality-$fps.mp4"; $log = "$PWD\rec\quality-$fps.txt"
          Start-Process $exe -ArgumentList "--record 5 --fps $fps --encoder software --quality high --pattern --test-tone --out `"$out`" --log `"$log`"" -Wait
          Get-Content $log | Select-Object -First 6
          if (-not (Select-String -Path $log -Pattern '^ok=1' -Quiet)) { throw "pattern recording failed" }
          $m = (Select-String -Path $log -Pattern 'capture_fps=([\d.]+) encode_fps=([\d.]+)').Matches[0].Groups
          $cf = [double]$m[1].Value; $ef = [double]$m[2].Value
          $nf = [int](ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 $out)
          "fps: target=$fps capture=$cf encode=$ef decoded_frames=$nf (expected ~$($fps*5))"
          if ($ef -lt $fps * 0.95) { throw "achieved encode fps $ef < 95% of $fps" }
          if ($nf -lt $fps * 5 * 0.95) { throw "only $nf frames for 5 s at $fps" }
          # Compare against an ideal BT.709 limited-range 4:2:0 reference (exact float math, written by the app),
          # so the score measures our conversion + the encoder, not 4:2:0 subsampling or ffmpeg's RGB matrix.
          $dec = "$PWD\rec\quality-$fps.yuv"
          & ffmpeg -v error -i $out -f rawvideo -pix_fmt yuv420p -y $dec
          $raw = @('-f','rawvideo','-pix_fmt','yuv420p','-s','1280x720')
          # raw vs raw: no implicit range/matrix conversion inside ffmpeg; the reference frame is looped by the filter
          $ss = & ffmpeg -hide_banner @raw -i $dec @raw -i $ref -lavfi "[1:v]loop=-1:1:0[r];[0:v][r]ssim=shortest=1" -f null - 2>&1 | Select-String 'All:([\d.]+)' | Select-Object -Last 1
          $ps = & ffmpeg -hide_banner @raw -i $dec @raw -i $ref -lavfi "[1:v]loop=-1:1:0[r];[0:v][r]psnr=shortest=1" -f null - 2>&1 | Select-String 'PSNR y:([\d.inf]+)' | Select-Object -Last 1
          Remove-Item $dec
          $ssim = [double]$ss.Matches[0].Groups[1].Value
          $psnrS = $ps.Matches[0].Groups[1].Value; $psnr = if ($psnrS -eq 'inf') { 99 } else { [double]$psnrS }
          "quality: SSIM=$ssim PSNR-Y=$psnr dB"
          if ($ssim -lt 0.98) { throw "SSIM $ssim < 0.98 (warping / artifacts / starved bitrate)" }
          if ($psnr -lt 40) { throw "PSNR-Y $psnr dB < 40" }
      - name: Start latency (press -> first frame) after the startup warm-up
        shell: pwsh
        run: |
          $exe = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory rec -Force | Out-Null
          $fps = ${{ matrix.fps }}
          $out = "$PWD\rec\latency-$fps.mp4"; $log = "$PWD\rec\latency-$fps.txt"
          Start-Process $exe -ArgumentList "--warmup --record 2 --fps $fps --encoder software --allow-synthetic --test-tone --out `"$out`" --log `"$log`"" -Wait
          Get-Content $log | Select-Object -First 8
          if (-not (Select-String -Path $log -Pattern '^ok=1' -Quiet)) { throw "latency recording failed" }
          $ms = [double](Select-String -Path $log -Pattern '^start_ms=([\d.]+)').Matches[0].Groups[1].Value
          "start latency: $ms ms"
          if ($ms -gt 500) { throw "press-to-first-frame $ms ms > 500 ms" }
      - name: Settings persist across restart (real UI clicks, exit via X)
        if: matrix.fps == 30
        shell: pwsh
        run: |
          $exe = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          $sf = "$env:RUNNER_TEMP\selftest-settings.json"
          Remove-Item $sf -ErrorAction SilentlyContinue
          $npS = Start-Process notepad -PassThru; Start-Sleep 3
          $p = Start-Process $exe -ArgumentList "--selftest-settings --settings-file `"$sf`"" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "UI did not exit after clicking X" }
          if (-not (Test-Path $sf)) { throw "settings file not written" }
          Start-Process $exe -ArgumentList "--print-settings --settings-file `"$sf`" --log `"$env:RUNNER_TEMP\printed.json`"" -Wait
          $j = Get-Content "$env:RUNNER_TEMP\printed.json" -Raw | ConvertFrom-Json
          $j | Format-List
          if ($j.fps -ne 30) { throw "fps not persisted" }
          if ($j.quality -ne 'ultra') { throw "quality not persisted" }
          if ($j.container -ne 'mkv') { throw "container not persisted" }
          if ($j.version -ne 3) { throw "settings version $($j.version) != 3" }
          if ($j.scale -ne '1440p') { throw "resolution not persisted: $($j.scale)" }
          if ($j.autoRemux -ne $false) { throw "autoRemux not persisted" }
          if ($j.replayEnabled -ne $true) { throw "replayEnabled not persisted" }
          if ($j.replaySeconds -ne 45) { throw "custom replay length not persisted: $($j.replaySeconds)" }
          if ($j.theme -ne 'light') { throw "theme not persisted: $($j.theme)" }
          if ($j.accent -ne 'blue') { throw "accent not persisted: $($j.accent)" }
          if ($j.separateTracks -ne $true) { throw "separateTracks not persisted" }
          if ($j.fileNamePattern -ne 'date_time') { throw "fileNamePattern not persisted" }
          if ($j.PSObject.Properties.Name -match 'creenshot') { throw "screenshot keys still written (removed in v1.1)" }
          if ($j.hotkeySaveReplay -ne 'Ctrl+Alt+F7') { throw "save-replay hotkey not persisted: $($j.hotkeySaveReplay)" }
          if ($j.systemAudio -ne $false) { throw "systemAudio not persisted" }
          if ($j.micEnabled -ne $true) { throw "micEnabled not persisted" }
          if ($j.hotkeyMicMute -ne 'Ctrl+Alt+F12') { throw "mic hotkey not persisted: $($j.hotkeyMicMute)" }
          if ($j.maximized -ne $true) { throw "maximized not persisted" }
          Stop-Process -Id $npS.Id -Force -ErrorAction SilentlyContinue
          if ($j.sourceKind -ne 'window') { throw "source kind not persisted: $($j.sourceKind)" }
          if ($j.sourceExe -notmatch '(?i)notepad') { throw "source exe not persisted: $($j.sourceExe)" }
          if ($j.micVolume -ne 150) { throw "micVolume not persisted" }
          if ($j.noiseSuppression -ne $true) { throw "noiseSuppression not persisted" }
          if ($j.noiseGateDb -ne -50) { throw "noiseGateDb not persisted" }
          if ($j.monitoring -ne $true) { throw "monitoring not persisted" }
          if ($j.pushToTalk -ne $true) { throw "pushToTalk not persisted" }
          if ($j.channels -ne 1) { throw "channels (mono, non-default) not persisted" }
          $applog = "$env:APPDATA\Cast Recorder\CastRecorder.log"
          if (-not (Test-Path $applog)) { throw "CastRecorder.log missing" }
          Get-Content $applog | Select-Object -Last 40
          foreach ($pat in 'settings (loaded|missing)', 'settings saved', 'warm-up', 'latency=\[', 'exit', 'selftest: recordings listed', 'selftest: encoder', 'encoders for') {
            if (-not (Select-String -Path $applog -Pattern $pat -Quiet)) { throw "CastRecorder.log lacks '$pat'" }
          }
          Copy-Item $applog rec\CastRecorder.log
      - name: Cold start (fresh process, no warm-up) x3, GUI cold start, audio stats
        shell: pwsh
        run: |
          $exe = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory rec -Force | Out-Null
          $fps = ${{ matrix.fps }}
          foreach ($k in 1..3) {
            $log = "$PWD\rec\cold-$fps-$k.txt"
            Start-Process $exe -ArgumentList "--record 2 --fps $fps --encoder software --allow-synthetic --test-tone --out `"$PWD\rec\cold-$fps-$k.mp4`" --log `"$log`"" -Wait
            if (-not (Select-String -Path $log -Pattern '^ok=1' -Quiet)) { Get-Content $log; throw "cold recording $k failed" }
            $ms = [double](Select-String -Path $log -Pattern '^start_ms=([\d.]+)').Matches[0].Groups[1].Value
            $lat = (Select-String -Path $log -Pattern '^latency=(.*)').Matches[0].Groups[1].Value
            "CLI cold start #$k : $ms ms  [$lat]"
            if ($ms -gt 300) { throw "cold press-to-first-frame $ms ms > 300 ms" }
            if (-not (Select-String -Path $log -Pattern 'audio stats: produced=[1-9]' -Quiet)) { throw "audio stats line empty" }
          }
          if ($fps -eq 60) {
            # GUI: launch, press Record as soon as the message loop runs (warm-up still in flight), stop at 2 s, X
            $sf = "$env:RUNNER_TEMP\cold-gui.json"
            New-Item -ItemType Directory "$PWD\rec\gui" -Force | Out-Null
            @{version=2; fps=60; encoder="software"; outputDir="$PWD\rec\gui"; systemAudio=$false} | ConvertTo-Json | Set-Content $sf
            $p = Start-Process $exe -ArgumentList "--selftest-record --settings-file `"$sf`"" -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "GUI cold-start test hung" }
            $applog = "$env:APPDATA\Cast Recorder\CastRecorder.log"
            $m = Select-String -Path $applog -Pattern 'start_ms=(\d+); latency=\[([^\]]*)' | Select-Object -Last 1
            if (-not $m) { Get-Content $applog | Select-Object -Last 40; throw "no GUI recording in CastRecorder.log" }
            $gms = [double]$m.Matches[0].Groups[1].Value
            "GUI cold start (Record right after launch): $gms ms  [$($m.Matches[0].Groups[2].Value)]"
            $f = Get-ChildItem "$PWD\rec\gui" -Filter *.mp4 | Select-Object -First 1
            if (-not $f) { throw "GUI cold-start recording not saved" }
            & ffmpeg -v error -i $f.FullName -f null - 2>&1 | Tee-Object -Variable fe
            if ($LASTEXITCODE -ne 0 -or $fe) { throw "GUI recording does not decode cleanly" }
            if ($gms -gt 300) { throw "GUI cold press-to-first-frame $gms ms > 300 ms" }
          }
      - name: Window capture (WGC CreateForWindow), incl. the window closing mid-recording
        if: matrix.fps == 30
        shell: pwsh
        run: |
          $exe = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory rec -Force | Out-Null
          $np = Start-Process notepad -PassThru; Start-Sleep 3
          Start-Process $exe -ArgumentList "--list-windows --log `"$PWD\rec\windows.txt`"" -Wait
          Get-Content "$PWD\rec\windows.txt"
          $log = "$PWD\rec\window.txt"; $out = "$PWD\rec\window.mp4"
          Start-Process $exe -ArgumentList "--window notepad --record 2 --encoder software --out `"$out`" --log `"$log`"" -Wait
          Get-Content $log | Select-Object -First 8
          if (-not (Select-String -Path $log -Pattern '^ok=1' -Quiet)) { throw "window recording failed" }
          if (-not (Select-String -Path $log -Pattern 'capture=Windows Graphics Capture \(window\)' -Quiet)) { throw "not a window capture" }
          & ffmpeg -v error -i $out -f null - 2>&1 | Tee-Object -Variable fe
          if ($LASTEXITCODE -ne 0 -or $fe) { throw "window recording does not decode" }
          # close the window 2 s into a 6 s recording: must end early, keep a playable file
          $log2 = "$PWD\rec\window-closed.txt"; $out2 = "$PWD\rec\window-closed.mp4"
          $p = Start-Process $exe -ArgumentList "--window notepad --record 6 --encoder software --out `"$out2`" --log `"$log2`"" -PassThru
          Start-Sleep 3; Stop-Process -Id $np.Id -Force
          if (-not $p.WaitForExit(20000)) { $p.Kill(); throw "recording did not end after the window closed" }
          Get-Content $log2 | Select-Object -First 4
          if (-not (Select-String -Path $log2 -Pattern 'window_closed=1' -Quiet)) { throw "window close not detected" }
          if (-not (Select-String -Path $log2 -Pattern '^ok=1' -Quiet)) { throw "file not kept after window closed" }
          $d = [double](ffprobe -v error -show_entries format=duration -of csv=p=0 $out2)
          "duration after close: $d s"
          if ($d -ge 5.5) { throw "recording did not stop at window close ($d s)" }
      - name: v2 source selection (all / monitor / window), NS+gate recording, UI renders
        if: matrix.fps == 30
        shell: pwsh
        run: |
          $exe = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory rec\v2 -Force | Out-Null
          $np = Start-Process notepad -PassThru; Start-Sleep 3
          Start-Process $exe -ArgumentList "--list-sources --log `"$PWD\rec\v2\sources.txt`"" -Wait
          Get-Content "$PWD\rec\v2\sources.txt"
          foreach ($src in 'all','monitor:1','window:notepad') {
            $n = $src -replace '[:]','-'
            $log = "$PWD\rec\v2\src-$n.txt"; $out = "$PWD\rec\v2\src-$n.mp4"
            Start-Process $exe -ArgumentList "--source $src --record 2 --encoder software --allow-synthetic --out `"$out`" --log `"$log`"" -Wait
            Get-Content $log | Select-Object -First 6
            if (-not (Select-String -Path $log -Pattern '^ok=1' -Quiet)) { throw "source $src recording failed" }
            if ($src -like 'window:*' -and -not (Select-String -Path $log -Pattern 'capture=.*\(window\)' -Quiet)) { throw "source $src was not a window capture" }
            & ffmpeg -v error -i $out -f null - 2>&1 | Tee-Object -Variable fe
            if ($LASTEXITCODE -ne 0 -or $fe) { throw "source $src recording does not decode" }
          }
          Stop-Process -Id $np.Id -Force -ErrorAction SilentlyContinue
          $log = "$PWD\rec\v2\ns.txt"; $out = "$PWD\rec\v2\ns.mp4"
          Start-Process $exe -ArgumentList "--record 3 --test-mic --noise-suppression on --noise-gate -42 --channels 1 --encoder software --allow-synthetic --out `"$out`" --log `"$log`"" -Wait
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern '^ok=1' -Quiet)) { throw "NS+gate recording failed" }
          $m = (Select-String -Path $log -Pattern 'testmic: noise_in_db=(-?[\d.]+) noise_out_db=(-?[\d.]+|-inf)').Matches
          if (-not $m) { throw "no testmic stats" }
          $in = [double]$m[0].Groups[1].Value; $o = $m[0].Groups[2].Value
          $od = if ($o -eq '-inf') { -200.0 } else { [double]$o }
          "noise in=$in dB out=$od dB"
          if ($od -gt $in - 10) { throw "noise not reduced by >= 10 dB" }
          & ffmpeg -v error -i $out -f null - 2>&1 | Tee-Object -Variable fe
          if ($LASTEXITCODE -ne 0 -or $fe) { throw "NS+gate recording does not decode cleanly" }
          $ch = ffprobe -v error -select_streams a:0 -show_entries stream=channels -of csv=p=0 $out
          if ([int]$ch -ne 1) { throw "expected mono audio, got $ch channels" }
          foreach ($st in 'idle','source','settings','recording','micpop') {
            Start-Process $exe -ArgumentList "--render-ui `"$PWD\rec\v2\ui-v2-$st.png`" --ui-state $st --log `"$PWD\rec\v2\ui-$st.txt`"" -Wait
            if (-not (Test-Path "$PWD\rec\v2\ui-v2-$st.png")) { throw "ui-v2-$st.png missing" }
          }
      - uses: actions/upload-artifact@v4
        if: matrix.fps == 30
        with:
          name: ui-v2-screenshots
          path: rec/v2/ui-v2-*.png
      - name: v1.0 features (replay, remux, separate tracks, toasts excluded from capture, HEVC, hotkeys)
        if: matrix.fps == 30
        shell: pwsh
        run: |
          $exe = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          $v = "$PWD\rec\v1"; New-Item -ItemType Directory $v -Force | Out-Null
          function Run($a, $log) { $p = Start-Process $exe -ArgumentList "$a --log `"$log`"" -Wait -PassThru; Get-Content $log -ErrorAction SilentlyContinue | Select-Object -First 14 | Out-Host; return $p.ExitCode }
          function Dur($f) { [double](ffprobe -v error -show_entries format=duration -of csv=p=0 $f) }
          function Clean($f) { $d = & ffmpeg -hide_banner -v error -xerror -i $f -map 0 -f null - 2>&1; if ($LASTEXITCODE -ne 0 -or $d) { $d; throw "$f does not decode cleanly" } }
          # --- encoders (HEVC/AV1 shown only when present)
          Start-Process $exe -ArgumentList "--list-encoders --log `"$v\encoders.txt`"" -Wait
          "encoders:"; Get-Content "$v\encoders.txt"
          $hevc = Select-String -Path "$v\encoders.txt" -Pattern '^HEVC' -Quiet
          # --- instant replay while recording: 5 s buffer saved 7 s into an 8 s recording
          $rc = Run "--record 8 --replay 5 --save-replay-at 7 --encoder software --allow-synthetic --test-tone --out `"$v\rp-main.mp4`" --replay-out `"$v\rp.mp4`"" "$v\rp.txt"
          if (-not (Select-String -Path "$v\rp.txt" -Pattern '^replay_ok=1' -Quiet)) { throw "replay save failed" }
          $rs = [double](Select-String -Path "$v\rp.txt" -Pattern 'replay_seconds=([\d.]+)').Matches[0].Groups[1].Value
          $rd = Dur "$v\rp.mp4"
          "replay: reported=$rs s file=$rd s"
          if ($rs -lt 4.4 -or $rs -gt 5.6) { throw "replay length $rs s not 5 +-0.5 s (nearest 1 s key frame)" }
          if ([math]::Abs($rd - $rs) -gt 0.35) { throw "replay file $rd s != reported $rs s" }
          Clean "$v\rp.mp4"
          if (-not ((ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 "$v\rp.mp4") -match 'aac')) { throw "replay has no audio" }
          $k0 = ffprobe -v error -select_streams v:0 -show_entries frame=key_frame -of csv=p=0 -read_intervals "%+#1" "$v\rp.mp4" | Select-Object -First 1
          if ($k0 -ne '1') { throw "replay does not start on a key frame" }
          Clean "$v\rp-main.mp4"
          # replay buffer only (no recording file)
          $rc = Run "--record 6 --replay 10 --replay-only --save-replay-at 5 --encoder software --allow-synthetic --out `"$v\ro.mp4`" --replay-out `"$v\ro-replay.mp4`"" "$v\ro.txt"
          if ($rc -ne 0) { throw "replay-only exit $rc" }
          if (Test-Path "$v\ro.mp4") { throw "replay-only wrote a recording" }
          $rd = Dur "$v\ro-replay.mp4"; "replay-only file: $rd s"
          if ($rd -lt 3.0 -or $rd -gt 5.6) { throw "replay-only length $rd" }
          Clean "$v\ro-replay.mp4"
          # --- replay RAM cap: 60 s asked, 2 MB allowed -> memory stays under the cap, replay gets shorter
          $rc = Run "--record 8 --replay 60 --replay-max-mb 2 --save-replay-at 7.5 --encoder software --allow-synthetic --test-tone --out `"$v\cap-main.mp4`" --replay-out `"$v\cap.mp4`"" "$v\cap.txt"
          $cl = (Select-String -Path "$v\cap.txt" -Pattern 'replay_ok=1 replay_seconds=([\d.]+) replay_buffered=[\d.]+ replay_ram=(\d+) replay_cap=(\d+) replay_capped=(\d)').Matches
          if (-not $cl) { throw "capped replay failed" }
          $g = $cl[0].Groups; "replay cap: seconds=$($g[1].Value) ram=$($g[2].Value) cap=$($g[3].Value) capped=$($g[4].Value)"
          if ([long]$g[2].Value -gt [long]$g[3].Value) { throw "replay buffer exceeds its RAM cap" }
          if ($g[4].Value -ne '1' -or [double]$g[1].Value -ge 7) { throw "RAM cap did not limit the replay" }
          Clean "$v\cap.mp4"
          # --- crash safety: kill the recorder mid-recording; the fragmented MP4 must still play
          $kp = Start-Process $exe -ArgumentList "--record 12 --encoder software --allow-synthetic --test-tone --out `"$v\killed.mp4`" --log `"$v\killed.txt`"" -PassThru
          Start-Sleep 6; Stop-Process -Id $kp.Id -Force; Start-Sleep 1
          if (-not (Test-Path "$v\killed.mp4")) { throw "killed recording left no file" }
          $kd = [int](ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$v\killed.mp4")
          "killed after ~6 s: $((Get-Item "$v\killed.mp4").Length) bytes, $kd decodable frames"
          if ($kd -lt 60) { throw "killed recording keeps only $kd frames (expected >= 2 s)" }
          # --- abort() publishes first and the worker loses the claim later: the loser must NOT delete the saved file
          $lp = Start-Process $exe -ArgumentList "--record 3 --encoder software --allow-synthetic --test-tone --test-late-publish 3000 --out `"$v\late.mp4`" --log `"$v\late.txt`"" -Wait -PassThru
          Get-Content "$v\late.txt" | Select-Object -First 14 | Out-Host
          if (-not (Select-String -Path "$v\late.txt" -Pattern '^late_publish_lost=1' -Quiet)) { throw "worker did not lose the publish claim (test hook)" }
          if (-not (Test-Path "$v\late.mp4") -or (Get-Item "$v\late.mp4").Length -eq 0) { throw "the losing save thread deleted late.mp4" }
          $lf = [int](ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$v\late.mp4")
          "late publish: file kept, $lf decodable frames"; if ($lf -lt 30) { throw "late.mp4 has only $lf frames" }
          # --- post-processing outside the watchdog: GUI, MKV, conversion stalled 20 s (as for a ~5 GB file), then X.
          # The MP4 must be saved and untouched; the stalled copy must not delete it.
          $sp = "$env:RUNNER_TEMP\slowpost.json"; New-Item -ItemType Directory "$v\slow" -Force | Out-Null
          @{version=3; fps=30; encoder="software"; outputDir="$v\slow"; systemAudio=$false; container="mkv"; autoRemux=$false} | ConvertTo-Json | Set-Content $sp
          $t0 = Get-Date
          $p = Start-Process $exe -ArgumentList "--selftest-record --settings-file `"$sp`" --test-slow-post 20000" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "GUI exit hung behind a slow post-process" }
          $el = ((Get-Date) - $t0).TotalSeconds; "GUI exited after $el s"
          Get-ChildItem "$v\slow" | Format-Table Name, Length
          $sm = Get-ChildItem "$v\slow" -Filter *.mp4 | Where-Object { $_.Name -notmatch 'castrec-tmp' } | Select-Object -First 1
          if (-not $sm) { throw "the saved recording was lost while its MKV conversion was stalled" }
          Clean $sm.FullName
          if ($el -gt 30) { throw "exit waited $el s for the background conversion" }
          $applog = "$env:APPDATA\Cast Recorder\CastRecorder.log"
          if (-not (Select-String -Path $applog -Pattern 'still running - the saved file is kept' -Quiet)) { throw "no 'kept' log line for the stalled conversion" }
          # same, without the stall: the MKV replaces the MP4
          New-Item -ItemType Directory "$v\fast" -Force | Out-Null
          # startup sweep: only journaled *.castrec-tmp* leftovers go (to the Recycle Bin); user files survive the restart
          Set-Content "$v\fast\My clip.part.mp4" "user file"; Set-Content "$v\fast\user.castrec-tmp.mp4" "not journaled"; Set-Content "$v\fast\dead.castrec-tmp.mkv" "leftover"
          New-Item -ItemType Directory "$env:APPDATA\Cast Recorder" -Force | Out-Null
          [System.IO.File]::WriteAllText("$env:APPDATA\Cast Recorder\temp-files.journal", "$v\fast\dead.castrec-tmp.mkv`n$v\fast\My clip.part.mp4`n", (New-Object System.Text.UTF8Encoding $false))
          # a saved window title with "; " and a secret: must never reach the log
          @{version=3; fps=30; encoder="software"; outputDir="$v\fast"; systemAudio=$false; container="mkv"; autoRemux=$false; sourceKind="window"; sourceExe="nothere.exe"; sourceTitle="Secret Doc; token=hunter2 - Notepad"} | ConvertTo-Json | Set-Content $sp
          $p = Start-Process $exe -ArgumentList "--selftest-record --settings-file `"$sp`"" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "GUI MKV run hung" }
          Get-ChildItem "$v\fast" | Format-Table Name, Length
          $mk = Get-ChildItem "$v\fast" -Filter *.mkv | Where-Object { $_.Name -notmatch "castrec-tmp" } | Select-Object -First 1
          if (-not $mk) { throw "GUI MKV recording: no .mkv after the background conversion" }
          if ((ffprobe -v error -show_entries format=format_name -of csv=p=0 $mk.FullName) -notmatch 'matroska') { throw "not MKV" }
          if (Get-ChildItem "$v\fast" -Filter *.mp4 | Where-Object { $_.Name -notmatch "\.part\.mp4$|castrec-tmp" }) { throw "the MP4 was not removed after a good MKV conversion" }
          if (-not (Test-Path "$v\fast\My clip.part.mp4")) { throw "startup sweep deleted the user file My clip.part.mp4" }
          if (-not (Test-Path "$v\fast\user.castrec-tmp.mp4")) { throw "startup sweep deleted a temp-named file the app never created" }
          if (Test-Path "$v\fast\dead.castrec-tmp.mkv") { throw "journaled leftover dead.castrec-tmp.mkv was not swept" }
          if (-not (Select-String -Path $applog -Pattern 'startup: recycled 1 leftover temp file' -Quiet)) { throw "no startup recycle log line" }
          if (Select-String -Path $applog -Pattern 'hunter2|Secret Doc' -Quiet) { Select-String -Path $applog -Pattern 'hunter2|Secret Doc'; throw "window title leaked into the log" }
          "sweep + title redaction: ok"
          Clean $mk.FullName
          # --- large file (~5 GB): remux MKV -> MP4 with the default engine (Media Foundation), no timeout, source kept
          $big = "C:\castrec-big"; New-Item -ItemType Directory $big -Force | Out-Null
          & ffmpeg -hide_banner -v error -f lavfi -i "testsrc2=size=1920x1080:rate=30,noise=alls=30:allf=t" -f lavfi -i "sine=f=440:r=48000" -t 10 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -profile:v high -b:v 200M -maxrate 200M -bufsize 400M -g 30 -c:a aac -shortest -y "$big\seed.mkv"
          $seed = (Get-Item "$big\seed.mkv").Length; $loops = [math]::Ceiling(5.0e9 / $seed) - 1
          "seed $([math]::Round($seed/1MB)) MB, looping x$($loops + 1)"
          & ffmpeg -hide_banner -v error -stream_loop $loops -i "$big\seed.mkv" -c copy -y "$big\big.mkv"
          $bs = (Get-Item "$big\big.mkv").Length; "big.mkv: $([math]::Round($bs/1GB, 2)) GB"
          if ($bs -lt 4.5e9) { throw "could not build the ~5 GB test file" }
          Get-PSDrive C | Format-Table Name, Used, Free
          Remove-Item "$big\seed.mkv"
          $t0 = Get-Date
          # atomic: while the copy runs only big.castrec-tmp.mp4 exists; big.mp4 appears complete, by rename
          $bp = Start-Process $exe -ArgumentList "--remux `"$big\big.mkv`" `"$big\big.mp4`" --log `"$v\bigremux.txt`"" -PassThru
          $sawPart = $false
          while (-not $bp.HasExited) { if (Test-Path "$big\big.castrec-tmp.mp4") { $sawPart = $true; if (Test-Path "$big\big.mp4") { throw "big.mp4 exists while the remux is still writing" } }; Start-Sleep -Milliseconds 500 }
          $bp.WaitForExit(); $rc = $bp.ExitCode
          if (-not $sawPart) { throw "remux did not write to big.castrec-tmp.mp4" }
          if (Test-Path "$big\big.castrec-tmp.mp4") { throw "leftover big.castrec-tmp.mp4 after the remux" }
          $el = ((Get-Date) - $t0).TotalSeconds
          if ($rc -ne 0) { Get-Content "$v\bigremux.txt"; throw "5 GB remux failed" }
          $ms = (Get-Item "$big\big.mp4").Length
          "5 GB remux (MF): $([math]::Round($el)) s, mp4 $([math]::Round($ms/1GB, 2)) GB"
          if (-not (Test-Path "$big\big.mkv")) { throw "the source MKV was deleted" }
          $d1 = Dur "$big\big.mkv"; $d2 = Dur "$big\big.mp4"; "durations mkv=$d1 mp4=$d2"
          if ([math]::Abs($d1 - $d2) -gt 0.5) { throw "5 GB remux duration differs" }
          & ffmpeg -hide_banner -v error -sseof -3 -i "$big\big.mp4" -f null - 2>&1 | Tee-Object -Variable te
          if ($te) { throw "tail of the 5 GB MP4 does not decode" }
          Remove-Item $big -Recurse -Force
          # --- a failing remux leaves neither the output nor a .part
          [System.IO.File]::WriteAllBytes("$v\bad.mkv", [byte[]](1..4096 | ForEach-Object { $_ % 251 }))
          $rc = Run "--remux `"$v\bad.mkv`" `"$v\bad.mp4`"" "$v\badremux.txt"
          if ($rc -eq 0) { throw "remux of garbage succeeded?" }
          if ((Test-Path "$v\bad.mp4") -or (Test-Path "$v\bad.castrec-tmp.mp4")) { throw "failed remux left bad.mp4 / bad.castrec-tmp.mp4" }
          # --- remux MKV -> MP4 without re-encoding, both engines
          $rc = Run "--record 3 --container mkv --encoder software --allow-synthetic --test-tone --out `"$v\rm.mkv`"" "$v\rm.txt"
          if ((ffprobe -v error -show_entries format=format_name -of csv=p=0 "$v\rm.mkv") -notmatch 'matroska') { throw "rm.mkv is not MKV" }
          $ref = & ffmpeg -v error -i "$v\rm.mkv" -map 0:v:0 -c copy -f hash -hash md5 - 2>&1
          $refDec = & ffmpeg -v error -i "$v\rm.mkv" -map 0:v:0 -f hash -hash md5 - 2>&1
          foreach ($eng in 'ffmpeg','mf') {
            $o = "$v\rm-$eng.mp4"
            $rc = Run "--remux `"$v\rm.mkv`" `"$o`" --remux-engine $eng" "$v\remux-$eng.txt"
            if ($rc -ne 0) { throw "remux ($eng) failed" }
            Clean $o
            $dec = & ffmpeg -v error -i $o -map 0:v:0 -f hash -hash md5 - 2>&1
            "remux $eng decoded md5: $dec (mkv $refDec)"
            if ($dec -ne $refDec) { throw "remux ($eng) changed the picture: re-encoded?" }
            if ($eng -eq 'ffmpeg') { $pk = & ffmpeg -v error -i $o -map 0:v:0 -c copy -f hash -hash md5 - 2>&1; "packets md5 mp4=$pk mkv=$ref"; if ($pk -ne $ref) { throw "remux (ffmpeg) video packets differ" } }
            if ([math]::Abs((Dur $o) - (Dur "$v\rm.mkv")) -gt 0.1) { throw "remux ($eng) duration differs" }
          }
          # auto-remux: MKV recorded, MP4 kept
          $rc = Run "--record 2 --container mkv --auto-remux on --encoder software --allow-synthetic --test-tone --out `"$v\am.mkv`"" "$v\am.txt"
          if (-not (Test-Path "$v\am.mp4") -or (Test-Path "$v\am.mkv")) { throw "auto-remux did not leave just am.mp4" }
          Clean "$v\am.mp4"
          # --- separate audio tracks: 1 mix, 2 system, 3 mic (MP4 and MKV)
          foreach ($c in 'mp4','mkv') {
            $o = "$v\tracks.$c"
            $rc = Run "--record 3 --separate-tracks --test-tone --test-mic --container $c --encoder software --allow-synthetic --out `"$o`"" "$v\tracks-$c.txt"
            if (-not (Select-String -Path "$v\tracks-$c.txt" -Pattern 'audio_tracks=3' -Quiet)) { throw "recorder did not write 3 tracks ($c)" }
            $as = ffprobe -v error -select_streams a -show_entries stream=index,codec_name:stream_tags=title,handler_name -of csv=p=0 $o; $as
            if (@($as).Count -ne 3) { throw "$c has $(@($as).Count) audio streams, expected 3" }
            if (-not ($as[0] -match 'Mix') -or -not ($as[2] -match 'Mic')) { throw "$c track names missing (Mix/System/Mic)" }
            Clean $o
            # track 1 (mix) carries both sources: it must be at least as loud as each
            $lv = foreach ($k in 0..2) { [double]((& ffmpeg -hide_banner -i $o -map 0:a:$k -af volumedetect -f null - 2>&1 | Select-String 'mean_volume: (-?[\d.]+)').Matches[0].Groups[1].Value) }
            "mean volume mix/system/mic: $($lv -join ' / ') dB"
            if ($lv[1] -lt -80 -or $lv[2] -lt -80) { throw "system or mic track is silent" }
          }
          # --- toasts must not appear in what we capture (WDA_EXCLUDEFROMCAPTURE); the control toast must
          Add-Type -AssemblyName System.Drawing
          function Magenta($png) { $b = [System.Drawing.Bitmap]::FromFile($png); $n = 0
            for ($y = 0; $y -lt $b.Height; $y += 2) { for ($x = 0; $x -lt $b.Width; $x += 2) { $c = $b.GetPixel($x, $y); if ($c.R -gt 220 -and $c.G -lt 40 -and $c.B -gt 220) { $n++ } } }
            $b.Dispose(); return $n }
          $rc = Run "--test-toast-visible `"$v\toast-visible.png`" --out `"$v\toast-visible.mp4`" --encoder software" "$v\toast-visible.txt"
          $rc = Run "--test-toast `"$v\toast-excluded.png`" --out `"$v\toast-excluded.mp4`" --encoder software" "$v\toast-excluded.txt"
          $mv = [long](Select-String -Path "$v\toast-visible.txt" -Pattern 'magenta_px=(\d+)').Matches[0].Groups[1].Value
          $me = [long](Select-String -Path "$v\toast-excluded.txt" -Pattern 'magenta_px=(\d+)').Matches[0].Groups[1].Value
          "screenshot magenta pixels: control=$mv excluded=$me"
          if (-not (Select-String -Path "$v\toast-excluded.txt" -Pattern 'excluded=1' -Quiet)) { throw "SetWindowDisplayAffinity(WDA_EXCLUDEFROMCAPTURE) failed" }
          if ($mv -lt 10000) { throw "control toast not visible in the screenshot ($mv px): test is not meaningful" }
          if ($me -gt 50) { throw "toast shows up in the screen capture ($me px)" }
          foreach ($k in 'visible','excluded') {
            if (Test-Path "$v\toast-$k.mp4") { & ffmpeg -v error -sseof -0.6 -i "$v\toast-$k.mp4" -frames:v 1 -y "$v\toast-$k-frame.png" }
          }
          if ((Test-Path "$v\toast-visible-frame.png") -and (Test-Path "$v\toast-excluded-frame.png")) {
            $fv = Magenta "$v\toast-visible-frame.png"; $fe = Magenta "$v\toast-excluded-frame.png"
            "video frame magenta (1/4 sampled): control=$fv excluded=$fe  [$((Select-String -Path "$v\toast-excluded.txt" -Pattern 'capture=.*').Matches[0].Value)]"
            if ($fv -gt 500) { if ($fe -gt 20) { throw "toast shows up in the recording ($fe px)" } } else { "video check skipped: the control toast isn't in the runner's capture either" }
          } else { "video check skipped: recording not available on this runner" }
          # --- HEVC where the machine has an encoder
          if ($hevc) {
            $rc = Run "--record 3 --codec hevc --container mkv --allow-synthetic --out `"$v\hevc.mkv`"" "$v\hevc.txt"
            $cn = ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$v\hevc.mkv"
            "hevc recording codec: $cn"
            if ($cn -ne 'hevc') { throw "HEVC requested and listed but file is $cn" }
            Clean "$v\hevc.mkv"
          } else {
            "HEVC: no HEVC encoder on this runner (no GPU, no HEVC Video Extensions); checking the fallback instead"
            $rc = Run "--record 2 --codec hevc --container mkv --allow-synthetic --out `"$v\hevc-fallback.mkv`"" "$v\hevc.txt"
            if ((ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$v\hevc-fallback.mkv") -ne 'h264') { throw "HEVC fallback to H.264 failed" }
          }
          # --- every hotkey through the real global-hotkey path (SendInput -> RegisterHotKey), with non-default combos
          $sf = "$env:RUNNER_TEMP\hotkeys.json"
          New-Item -ItemType Directory "$v\hk" -Force | Out-Null
          # v1.0 keys (hotkeyScreenshot / screenshotFormat) are included on purpose: v1.1 must load and ignore them
          @{version=3; fps=30; encoder="software"; outputDir="$v\hk"; systemAudio=$false; micEnabled=$false; replayEnabled=$true; replaySeconds=10;
            hotkeyToggleRecord="Ctrl+Alt+F9"; hotkeyPause="Ctrl+Alt+F10"; hotkeyMicMute="Ctrl+Alt+F11"; hotkeySaveReplay="Ctrl+Alt+F7"; hotkeyScreenshot="Ctrl+Alt+F6"; screenshotFormat="jpg"} | ConvertTo-Json | Set-Content $sf
          $p = Start-Process $exe -ArgumentList "--selftest-hotkeys --settings-file `"$sf`"" -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); throw "hotkey selftest hung" }
          $applog = "$env:APPDATA\Cast Recorder\CastRecorder.log"
          Select-String -Path $applog -Pattern 'selftest hotkey|selftest-hotkeys|^hotkeys:|replay buffer|toast:' | Select-Object -Last 30 | ForEach-Object { $_.Line }
          $res = Select-String -Path $applog -Pattern 'selftest-hotkeys: (\d+)/(\d+) ok' | Select-Object -Last 1
          if (-not $res) { throw "hotkey selftest did not finish" }
          if ($res.Matches[0].Groups[1].Value -ne $res.Matches[0].Groups[2].Value) { throw "hotkeys: $($res.Matches[0].Value)" }
          Get-ChildItem "$v\hk" | Format-Table Name, Length
          if (-not (Get-ChildItem "$v\hk" -Filter 'replay_*.mp4')) { throw "save-replay hotkey wrote no replay" }
          if (Get-ChildItem "$v\hk" -Filter 'screenshot_*') { throw "a screenshot was written (feature removed in v1.1)" }
          if ($res.Matches[0].Groups[2].Value -ne '7') { throw "expected 7 hotkey steps, got $($res.Matches[0].Groups[2].Value)" }
          $recf = Get-ChildItem "$v\hk" -Filter 'cast_*.mp4' | Select-Object -First 1
          if (-not $recf) { throw "start/stop hotkey wrote no recording (auto-remuxed MP4)" }
          Clean $recf.FullName
          Start-Process $exe -ArgumentList "--print-settings --settings-file `"$sf`" --log `"$v\hk-settings.json`"" -Wait
          $j = Get-Content "$v\hk-settings.json" -Raw | ConvertFrom-Json
          if ($j.hotkeySaveReplay -ne 'Ctrl+Alt+F7' -or ($j.PSObject.Properties.Name -match 'creenshot') -or $j.hotkeyToggleRecord -ne 'Ctrl+Alt+F9' -or $j.hotkeyPause -ne 'Ctrl+Alt+F10' -or $j.hotkeyMicMute -ne 'Ctrl+Alt+F11') { throw "hotkeys not persisted" }
          # --- UI v1.0 renders (2x, like the mockups)
          foreach ($st in 'idle','recording','settings','recordings','replaytoast','savedtoast','source','micpop','ctxmenu','replaycap','tooltip') {
            Start-Process $exe -ArgumentList "--render-ui `"$v\ui-v1-$st.png`" --ui-state $st --dpi 192 --log `"$v\ui-$st.txt`"" -Wait
            if (-not (Test-Path "$v\ui-v1-$st.png")) { throw "ui-v1-$st.png missing" }
          }
          foreach ($st in 'idle','settings') {
            Start-Process $exe -ArgumentList "--render-ui `"$v\ui-v1-light-$st.png`" --ui-state $st --ui-theme light --dpi 192 --log `"$v\ui-light-$st.txt`"" -Wait
            if (-not (Test-Path "$v\ui-v1-light-$st.png")) { throw "ui-v1-light-$st.png missing" }
          }
      - uses: actions/upload-artifact@v4
        if: matrix.fps == 30
        with:
          name: ui-v1-screenshots
          path: rec/v1/ui-v1-*.png
      - name: Window picker (Brave-style popup vs main window) and tiny / minimized window capture size
        if: matrix.fps == 30
        shell: pwsh
        run: |
          $exe = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          $d = "$PWD\rec\picker"; New-Item -ItemType Directory $d -Force | Out-Null
          $p = Start-Process $exe -ArgumentList "--test-window-picker `"$d`" --log `"$d\picker.txt`"" -Wait -PassThru
          Get-Content "$d\picker.txt"
          if ($p.ExitCode -ne 0) { throw "window picker test failed (exit $($p.ExitCode))" }
          foreach ($n in 'popup','hover','owned') { if (-not (Select-String -Path "$d\picker.txt" -Pattern "^picker $n listed=0" -Quiet)) { throw "$n is selectable" } }
          # main + duplicate share a title: both stay listed; the later one in z-order is numbered "(2)"
          $lm = (Select-String -Path "$d\picker.txt" -Pattern '^label=(.*)$').Matches[0].Groups[1].Value
          $ld = (Select-String -Path "$d\picker.txt" -Pattern '^label_duplicate=(.*)$').Matches[0].Groups[1].Value
          "main label: $lm | duplicate label: $ld"
          $plain = @($lm, $ld) | Where-Object { $_ -match '^Cast Recorder . CR Picker Main$' }
          $num = @($lm, $ld) | Where-Object { $_ -match '^Cast Recorder . CR Picker Main \(2\)$' }
          if (@($plain).Count -ne 1 -or @($num).Count -ne 1) { throw "main window label is not 'app · page' with the ' - Brave' suffix stripped, or same-title windows are not kept apart as '(2)'" }
          if (-not (Select-String -Path "$d\picker.txt" -Pattern '^resolve_saved=main' -Quiet)) { throw "a saved popup title did not resolve to the real window" }
          foreach ($n in 'tiny','minimized') {
            $f = "$d\picker-$n.mp4"
            if (-not (Test-Path $f)) { throw "$f missing" }
            $wh = (ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 $f) -split ','
            $w = [int]$wh[0]; $h = [int]$wh[1]; "${n} window -> encoded ${w}x${h}"
            if ($w -lt 128 -or $h -lt 128 -or ($w % 2) -or ($h % 2)) { throw "${n}: ${w}x${h} is not even and >= 128" }
            $dec = & ffmpeg -hide_banner -v error -xerror -i $f -map 0 -f null - 2>&1
            if ($LASTEXITCODE -ne 0 -or $dec) { $dec; throw "$f does not decode cleanly" }
            if ($n -eq 'minimized' -and ($w -lt 560 -or $h -lt 400)) { throw "minimized-at-start window encoded at ${w}x${h}, not near its restored 641x481" }
          }
      - name: Persistence through %APPDATA% (non-default values, Cyrillic path, close via WM_CLOSE)
        if: matrix.fps == 15
        shell: pwsh
        run: |
          $exe = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          $d = "$env:APPDATA\Cast Recorder"; New-Item -Force -ItemType Directory $d | Out-Null
          $od = "$env:RUNNER_TEMP\Записи"
          @{version=2; fps=60; quality="low"; encoder="software"; scale="720p"; container="mov"; systemAudio=$false;
            micEnabled=$true; micDevice=""; hotkeyToggleRecord="Ctrl+Alt+F1"; hotkeyPause="Ctrl+Alt+F2"; hotkeyMicMute="Ctrl+Alt+F3";
            outputDir=$od; maximized=$true; pauseTones=$true} | ConvertTo-Json | Set-Content -Encoding utf8 "$d\settings.json"
          $p = Start-Process $exe -PassThru; Start-Sleep 5
          [void]$p.CloseMainWindow()
          if (-not $p.WaitForExit(20000)) { $p.Kill(); throw "app did not exit on WM_CLOSE" }
          $s = Get-Content "$d\settings.json" -Raw -Encoding utf8 | ConvertFrom-Json
          $s | Format-List
          if ($s.fps -ne 60 -or $s.quality -ne 'low' -or $s.container -ne 'mov' -or $s.scale -ne '720p' -or $s.hotkeyToggleRecord -ne 'Ctrl+Alt+F1' -or
              $s.hotkeyPause -ne 'Ctrl+Alt+F2' -or $s.hotkeyMicMute -ne 'Ctrl+Alt+F3' -or -not $s.maximized -or $s.systemAudio -or -not $s.micEnabled -or
              $s.outputDir -ne $od -or -not $s.pauseTones) { throw "persistence lost" }
          $applog = "$d\CastRecorder.log"
          if (Select-String -Path $applog -Pattern ([regex]::Escape($env:USERNAME + '\')) -Quiet) { throw "user name not redacted in CastRecorder.log" }
          Copy-Item $applog rec\CastRecorder-15.log -ErrorAction SilentlyContinue
      - name: ffmpeg hijack probe (a fake ffmpeg.exe in the working folder must not run)
        if: matrix.fps == 30
        shell: pwsh
        run: |
          $exe = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory evil -Force | Out-Null
          # Fake ffmpeg: whoami.exe exits 0 but writes no file. If it were picked up, no .mkv would be produced and the
          # recorder would fall back to MP4. The real ffmpeg on PATH must be used instead.
          Copy-Item "$env:WINDIR\System32\whoami.exe" evil\ffmpeg.exe
          Push-Location evil
          $p = Start-Process $exe -ArgumentList "--record 2 --encoder software --container mkv --allow-synthetic --out `"$PWD\x.mkv`" --log `"$PWD\x.txt`"" -Wait -PassThru -WorkingDirectory $PWD
          Get-Content x.txt
          Pop-Location
          if (-not (Select-String -Path evil\x.txt -Pattern '^ok=1' -Quiet)) { throw "hijack cwd probe failed (log)" }
          if (-not (Test-Path evil\x.mkv)) { throw "x.mkv missing: the fake ffmpeg.exe from the working folder was used" }
          $fmt = ffprobe -v error -show_entries format=format_name -of csv=p=0 evil\x.mkv
          "format=$fmt"
          if ($fmt -notmatch 'matroska') { throw "not MKV: $fmt" }
          Copy-Item evil\x.txt rec\hijack-probe.txt
      - name: ffmpeg hijack probe (PATH starts with ".;" — relative entries must be ignored)
        if: matrix.fps == 30
        shell: pwsh
        run: |
          $exe = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory evil-path -Force | Out-Null
          Copy-Item "$env:WINDIR\System32\whoami.exe" evil-path\ffmpeg.exe
          Push-Location evil-path
          $env:Path = ".;" + $env:Path
          $p = Start-Process $exe -ArgumentList "--record 2 --encoder software --container mkv --allow-synthetic --out `"$PWD\y.mkv`" --log `"$PWD\y.txt`"" -Wait -PassThru -WorkingDirectory $PWD
          Get-Content y.txt
          Pop-Location
          if (-not (Select-String -Path evil-path\y.txt -Pattern '^ok=1' -Quiet)) { throw "hijack PATH probe failed (log)" }
          if (-not (Test-Path evil-path\y.mkv)) { throw "y.mkv missing: a relative PATH entry (.;) was used for ffmpeg" }
          $fmt = ffprobe -v error -show_entries format=format_name -of csv=p=0 evil-path\y.mkv
          "format=$fmt"
          if ($fmt -notmatch 'matroska') { throw "not MKV: $fmt" }
          Copy-Item evil-path\y.txt rec\hijack-path-probe.txt
      - name: Live encoder switch (encoder stalls 3 s in; recording and replay buffer keep going)
        if: matrix.fps == 30
        shell: pwsh
        run: |
          $exe = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          $o = "$PWD\rec\switch"; New-Item -ItemType Directory $o -Force | Out-Null
          $log = "$o\switch.txt"
          $p = Start-Process $exe -ArgumentList "--record 10 --fps 30 --replay 30 --save-replay-at 9.5 --test-encoder-stall 3 --encoder software --moving-pattern --test-tone --out `"$o\main.mp4`" --replay-out `"$o\replay.mp4`" --log `"$log`"" -Wait -PassThru
          $txt = Get-Content $log -Raw
          ($txt -split "`n" | Select-String -Pattern '^(ok|replay_|encoder=|frames|message|codec)|encoder switch|stall injected|replay ring:') | ForEach-Object { $_.Line }
          if ($p.ExitCode -ne 0) { throw "exit $($p.ExitCode): the session ended instead of switching encoder" }
          if ($txt -notmatch '(?m)^ok=1') { throw "recording not ok" }
          if ($txt -notmatch 'stall injected') { throw "stall was not injected" }
          if ($txt -notmatch 'encoder_switches=1') { throw "expected exactly one live encoder switch" }
          if ($txt -notmatch 'encoder switch: now Software') { throw "no switch to the software encoder logged" }
          if ($txt -match 'stopped responding') { throw "session reported the encoder as stopped" }
          function Clean($f) { $d = & ffmpeg -hide_banner -v error -xerror -i $f -map 0 -f null - 2>&1; if ($LASTEXITCODE -ne 0 -or $d) { $d; throw "$f does not decode cleanly" } }
          foreach ($f in "$o\main.mp4", "$o\replay.mp4") {
            Clean $f
            $dur = [double](ffprobe -v error -show_entries format=duration -of csv=p=0 $f)
            $n = [int](ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 $f)
            $last = [double]((ffprobe -v error -select_streams v:0 -show_entries packet=pts_time -of csv=p=0 $f | ForEach-Object { [double]$_ } | Measure-Object -Maximum).Maximum)
            $aud = ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 $f
            "$(Split-Path $f -Leaf): duration=$dur s frames=$n last_video_pts=$last audio=$aud"
            if ($dur -lt 8.5) { throw "$f is $dur s: footage before or after the switch is missing" }
            # no hole in the video timeline (the stalled encoder's frames are re-encoded): video ends with the audio
            if ($last -lt $dur - 1.0) { throw "$f video ends at $last s but the file is $dur s: frames lost in the switch left a hole (A/V drift)" }
            if ($n -lt 240) { throw "$f has only $n frames" }
            if (-not ($aud -match 'aac')) { throw "$f lost its audio" }
          }
          $k0 = ffprobe -v error -select_streams v:0 -show_entries frame=key_frame -of csv=p=0 -read_intervals "%+#1" "$o\replay.mp4" | Select-Object -First 1
          if ($k0 -ne '1') { throw "replay does not start on a key frame" }
          $rs = [double]([regex]::Match($txt, 'replay_seconds=([\d.]+)').Groups[1].Value)
          if ($rs -lt 8.5) { throw "replay buffer lost the footage from before the switch ($rs s)" }
          Remove-Item "$o\main.mp4", "$o\replay.mp4"
      - name: Replay ring wraps (moving content, 60 fps, 15 s buffer, 55 s run, save mid-run)
        if: matrix.fps == 60
        shell: pwsh
        run: |
          $exe = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          $o = "$PWD\rec\ring"; New-Item -ItemType Directory $o -Force | Out-Null
          $log = "$o\ring.txt"
          $a = "--record 55 --replay 15 --replay-only --save-replay-at 40 --moving-pattern --encoder software --fps 60 --out `"$o\ring-main.mp4`" --replay-out `"$o\ring-replay.mp4`" --log `"$log`""
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $exe -ArgumentList $a -PassThru
          $null = $p.Handle
          $mem = @()
          while (-not $p.HasExited) {
            try { $p.Refresh(); $mem += [pscustomobject]@{ t = $sw.Elapsed.TotalSeconds; mb = $p.PrivateMemorySize64 / 1MB } } catch {}
            Start-Sleep -Milliseconds 500
          }
          $p.WaitForExit()
          $txt = Get-Content $log -Raw
          ($txt -split "`n" | Select-String -Pattern '^(ok|replay_|capture|encoder=|frames|message)|replay ring:|software encode:') | ForEach-Object { $_.Line }
          if ($p.ExitCode -ne 0) { throw "exit $($p.ExitCode)" }
          if ($txt -notmatch 'capture=Synthetic') { throw "moving pattern not used" }
          $m = [regex]::Match($txt, 'replay_ok=1 replay_seconds=([\d.]+) replay_buffered=([\d.]+)')
          if (-not $m.Success) { throw "replay save failed" }
          $rs = [double]$m.Groups[1].Value
          if ($rs -lt 13.5 -or $rs -gt 16.5) { throw "replay length $rs s, expected about 15 s" }
          $rg = [regex]::Match($txt, 'replay ring: (\d+) packets, \d+ audio chunks, ([\d.]+) MB held, arena (\d+) x 4 MB blocks \((\d+) allocated, (\d+) reused, (\d+) released\)')
          if (-not $rg.Success) { throw "no replay ring stats" }
          $held = [double]$rg.Groups[2].Value; $blocks = [int]$rg.Groups[3].Value; $alloc = [int]$rg.Groups[4].Value; $reused = [int]$rg.Groups[5].Value
          "ring: held=$held MB blocks=$blocks allocated=$alloc reused=$reused"
          if ($reused -le 0) { throw "the ring never wrapped (0 blocks reused)" }
          if ($blocks * 4 -gt $held + 24) { throw "arena ($blocks x 4 MB) is far above what it holds ($held MB)" }
          # memory levels off once the buffer is full: compare 20-35 s with 45 s to the end
          $mid = ($mem | Where-Object { $_.t -ge 20 -and $_.t -lt 35 } | Measure-Object mb -Maximum).Maximum
          $end = ($mem | Where-Object { $_.t -ge 45 } | Measure-Object mb -Maximum).Maximum
          "private MB: 20-35 s max=$([math]::Round($mid,1)) 45 s+ max=$([math]::Round($end,1))"
          if ($end - $mid -gt 40) { throw "memory kept growing after the buffer filled ($mid -> $end MB)" }
          $f = "$o\ring-replay.mp4"
          $d = & ffmpeg -hide_banner -v error -xerror -i $f -map 0 -f null - 2>&1
          if ($LASTEXITCODE -ne 0 -or $d) { $d; throw "replay does not decode cleanly" }
          $k0 = (ffprobe -v error -select_streams v:0 -read_intervals "%+#1" -show_entries frame=key_frame -of csv=p=0 $f | Select-Object -First 1)
          if ($k0 -ne '1') { throw "replay does not start on a key frame" }
          $hashes = & ffmpeg -hide_banner -v error -i $f -map 0:v -frames:v 60 -f framemd5 - 2>$null | Where-Object { $_ -notmatch '^#' } | ForEach-Object { ($_ -split ',')[-1].Trim() }
          $uniq = ($hashes | Sort-Object -Unique).Count
          "distinct frames in the first 60: $uniq"
          if ($uniq -lt 30) { throw "replay content is not moving ($uniq distinct of 60)" }
          $mem | ConvertTo-Json | Set-Content "$o\mem.json"
          Remove-Item "$o\ring-replay.mp4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-recordings-${{ matrix.fps }}fps
          path: rec/

  ui-audit:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cast-recorder-windows
          path: art
      - name: Render every view at default / minimum / maximized sizes, 100-200 % DPI, both themes, long values
        shell: pwsh
        run: |
          $exe = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          $o = "$PWD\audit"; New-Item -ItemType Directory $o -Force | Out-Null
          $states = 'idle','recording','settings','recordings','micpop','source','dropdown','ctxmenu','savedtoast','replaytoast','replaycap','tooltip'
          $jobs = @()
          foreach ($st in $states) {
            $jobs += ,@($st, '1100x700', 96, 'dark', $false)
            foreach ($sz in '1100x700','960x620','1920x1040') { $jobs += ,@($st, $sz, 96, 'dark', $true) }
            foreach ($d in 120,144,192) { $jobs += ,@($st, '960x620', $d, 'dark', $true) }
            $jobs += ,@($st, '960x620', 96, 'light', $true)
          }
          $fail = 0
          foreach ($j in $jobs) {
            $name = "ui-$($j[0])-$($j[1])-$($j[2])-$($j[3])$(if ($j[4]) { '-long' } else { '' }).png"
            $a2 = "--render-ui `"$o\$name`" --ui-state $($j[0]) --ui-size $($j[1]) --dpi $($j[2]) --ui-theme $($j[3]) --log `"$o\log.txt`""
            if ($j[4]) { $a2 += " --ui-long" }
            $p = Start-Process $exe -ArgumentList $a2 -Wait -PassThru
            if ($p.ExitCode -ne 0 -or -not (Test-Path "$o\$name")) { "FAILED: $name"; $fail++ }
          }
          "rendered $((Get-ChildItem $o -Filter *.png).Count) of $($jobs.Count)"
          if ($fail) { throw "$fail renders failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: audit/*.png

  replay-perf:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cast-recorder-windows
          path: art
      - name: Get the published v1.0 build (before)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory old -Force | Out-Null
          gh release download v1.0 --repo ${{ github.repository }} --pattern CastRecorder.exe --dir old
          Get-ChildItem old
      - name: Replay buffer cost, v1.0 vs this build (60 fps, 30 s buffer, 20 s, replay-only, software encoder)
        shell: pwsh
        run: |
          $new = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          $old = (Resolve-Path old\CastRecorder.exe).Path
          $o = "$PWD\perf"; New-Item -ItemType Directory $o -Force | Out-Null
          function Perf($exe, $tag) {
            $log = "$o\$tag.txt"
            $a = "--record 20 --replay 30 --replay-only --save-replay-at 18 --encoder software --allow-synthetic --fps 60 --out `"$o\$tag-main.mp4`" --replay-out `"$o\$tag-replay.mp4`" --log `"$log`""
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process $exe -ArgumentList $a -PassThru
            $null = $p.Handle
            $peak = 0; $ws = @(); $cpuPrev = 0; $t0 = 0; $cpuMax = 0
            while (-not $p.HasExited) {
              try {
                $p.Refresh()
                $ws += $p.PrivateMemorySize64
                if ($p.PeakWorkingSet64 -gt $peak) { $peak = $p.PeakWorkingSet64 }
                $c = $p.TotalProcessorTime.TotalMilliseconds; $t = $sw.ElapsedMilliseconds
                if ($t0 -gt 0 -and $t -gt $t0) { $u = ($c - $cpuPrev) / ($t - $t0) * 100; if ($u -gt $cpuMax) { $cpuMax = $u } }
                $cpuPrev = $c; $t0 = $t
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            $p.WaitForExit()
            $cpu = $p.TotalProcessorTime.TotalSeconds; $wall = $sw.Elapsed.TotalSeconds
            $txt = Get-Content $log -Raw -ErrorAction SilentlyContinue
            $ok = $txt -match 'replay_ok=1'
            $ring = ([regex]::Match($txt, 'replay ring:[^\r\n]*')).Value
            $sws = ([regex]::Match($txt, 'software encode:[^\r\n]*')).Value
            $privMax = if ($ws.Count) { ($ws | Measure-Object -Maximum).Maximum } else { 0 }
            $privEnd = if ($ws.Count) { $ws[-1] } else { 0 }
            [pscustomobject]@{ build = $tag; replay_ok = $ok; exit = $p.ExitCode; cpu_s = [math]::Round($cpu, 2); wall_s = [math]::Round($wall, 1)
              cpu_pct_1core = [math]::Round($cpu / $wall * 100, 1); cpu_peak_pct = [math]::Round($cpuMax, 1)
              peak_ws_mb = [math]::Round($peak / 1MB, 1); private_max_mb = [math]::Round($privMax / 1MB, 1); private_end_mb = [math]::Round($privEnd / 1MB, 1)
              ring = $ring; sw = $sws }
          }
          $rows = @()
          foreach ($i in 1..2) { $rows += Perf $old "v1.0-run$i"; $rows += Perf $new "new-run$i" }
          $rows | Format-Table build, replay_ok, exit, cpu_s, wall_s, cpu_pct_1core, cpu_peak_pct, peak_ws_mb, private_max_mb, private_end_mb -AutoSize | Out-String -Width 220 | Tee-Object "$o\perf.txt"
          $rows | ConvertTo-Json | Set-Content "$o\perf.json"
          $md = "### Replay buffer cost (60 fps, 30 s buffer, 20 s run, replay-only, software encoder)`n`n| build | replay ok | CPU s | CPU % of 1 core | peak CPU % | peak working set MB | max private MB |`n|---|---|---|---|---|---|---|`n"
          foreach ($r in $rows) { $md += "| $($r.build) | $($r.replay_ok) | $($r.cpu_s) | $($r.cpu_pct_1core) | $($r.cpu_peak_pct) | $($r.peak_ws_mb) | $($r.private_max_mb) |`n" }
          foreach ($r in $rows) { if ($r.ring) { $md += "`n$($r.build): $($r.ring)" }; if ($r.sw) { $md += "`n$($r.build): $($r.sw)" } }
          $md | Add-Content $env:GITHUB_STEP_SUMMARY
          $md
          foreach ($r in $rows | Where-Object { $_.build -like 'new*' }) { if (-not $r.replay_ok) { throw "$($r.build): replay save failed" } }
      - name: Dropdown and source label renders, v1.0 vs this build
        shell: pwsh
        run: |
          $new = (Get-ChildItem art -Recurse -Filter CastRecorder.exe | Select-Object -First 1).FullName
          $old = (Resolve-Path old\CastRecorder.exe).Path
          $o = "$PWD\perf\renders"; New-Item -ItemType Directory $o -Force | Out-Null
          foreach ($b in @(@('before', $old), @('after', $new))) {
            foreach ($st in 'source','dropdown','replaytoast') {
              foreach ($d in 96,144,192) {
                $f = "$o\$($b[0])-$st-$d.png"
                $p = Start-Process $b[1] -ArgumentList "--render-ui `"$f`" --ui-state $st --ui-size 1100x700 --dpi $d --ui-long --log `"$o\log.txt`"" -Wait -PassThru
                "$($b[0]) $st $d -> exit $($p.ExitCode) $(Test-Path $f)"
              }
            }
          }
          if (-not (Get-ChildItem $o -Filter after-*.png)) { throw "no renders" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-perf-and-renders
          path: perf/
